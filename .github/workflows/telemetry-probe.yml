name: ANA telemetry probe
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read seven completed days for Manaus and Belém
        env:
          ANA_USER: ${{ secrets.ANA_USER }}
          ANA_PASS: ${{ secrets.ANA_PASS }}
        run: python3 scripts/probe.py
