name: Refresh and publish monitor
on:
  workflow_dispatch:
concurrency:
  group: publish-monitor
  cancel-in-progress: false
permissions: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh telemetry
        run: python3 scripts/update.py
        env:
          ANA_USER: ${{ secrets.ANA_USER }}
          ANA_PASS: ${{ secrets.ANA_PASS }}
      - run: python3 scripts/build.py
      - name: Save daily levels
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data(monitor): refresh daily levels"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: pages
